# macOS-only entry point; the Linux kitty.conf remains unchanged.
include ~/.dotfiles/kitty/.config/kitty/kitty.conf

# Release 0.37 supports permanent OS titles via kitty --title.
action_alias kitty_scrollback_nvim kitten ${HOME}/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
allow_remote_control socket-only
listen_on unix:${TMPDIR}/niri-mac-kitty-{kitty_pid}
macos_option_as_alt no
macos_quit_when_last_window_closed no
editor /opt/homebrew/bin/nvim

# Win belongs to the window manager. Alt kitty bindings come from the shared source.
map cmd+t new_tab
map cmd+w close_tab
map cmd+r set_tab_title
map cmd+enter new_window
map cmd+x close_window
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+shift+h neighboring_window left
map cmd+shift+j neighboring_window down
map cmd+shift+k neighboring_window up
map cmd+shift+l neighboring_window right
map cmd+shift+r load_config_file

# R75Pro physical Ctrl reaches terminal programs; Win is the separate WM layer.
# Alt+C/V and Alt+T/W/R/Enter/X/1-6 retain the Linux kitty bindings.
map option+c copy_to_clipboard
map option+v paste_from_clipboard
map cmd+shift+c copy_to_clipboard
map cmd+shift+v paste_from_clipboard

# Starship uses U+1F788 (VERY HEAVY WHITE CIRCLE), outside Nerd Font ranges.
symbol_map U+1F788 Noto Sans Symbols 2

# Prompt icons share the main font baseline; keep text size and rounded caps intact.
symbol_map U+F179,U+F303,U+F17C,U+F024B,U+F1D3 JetBrainsMono Nerd Font Mono
